[project]
name = "mjourney-backend"
version = "0.1.0"
description = "M-Journey hackathon backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
